{{- if .Values.networkPolicy.enabled }}
{{- $fn := include "aiobs.fullname" . }}
{{- $inst := .Release.Name }}
{{- $name := include "aiobs.name" . }}
# Default: nothing can talk to the platform's pods except what is allowed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-default-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $inst }}
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
---
# Agents (anywhere) -> collector. Metrics/health ports are reachable inside the namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-allow-collector
spec:
  podSelector:
    matchLabels: {{- include "aiobs.selector" (dict "root" . "component" "collector") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 4317, protocol: TCP}
        - {port: 4318, protocol: TCP}
    - from:
        - podSelector: {}
      ports:
        - {port: 8888, protocol: TCP}
        - {port: 13133, protocol: TCP}
---
# UI/API: reachable by users (ingress controller or port-forward) and by the collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-allow-langfuse-web
spec:
  podSelector:
    matchLabels: {{- include "aiobs.selector" (dict "root" . "component" "langfuse-web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 3000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-allow-langfuse-worker
spec:
  podSelector:
    matchLabels: {{- include "aiobs.selector" (dict "root" . "component" "langfuse-worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
      ports:
        - {port: 3030, protocol: TCP}
---
# Databases and storage: only Langfuse (and the retention job for ClickHouse) may connect.
{{- $stores := dict "postgres" (list 5432) "clickhouse" (list 8123 9000) "redis" (list 6379) "minio" (list 9000) }}
{{- range $component, $ports := $stores }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-allow-{{ $component }}
spec:
  podSelector:
    matchLabels: {{- include "aiobs.selector" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $inst }}
              app.kubernetes.io/name: {{ $name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [langfuse-web, langfuse-worker{{ if eq $component "clickhouse" }}, retention{{ end }}]
      ports:
        {{- range $ports }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
---
{{- end }}
{{- if .Values.monitoring.enabled }}
---
# Monitoring: Prometheus is reachable inside the namespace (Grafana, port-forward); Grafana by users.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-allow-prometheus
spec:
  podSelector:
    matchLabels: {{- include "aiobs.selector" (dict "root" . "component" "prometheus") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 9090, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-allow-grafana
spec:
  podSelector:
    matchLabels: {{- include "aiobs.selector" (dict "root" . "component" "grafana") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 3000, protocol: TCP}
{{- end }}
{{- end }}
