{{- $fn := include "aiobs.fullname" . }}
# ============================ Postgres ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "aiobs.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ $fn }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "aiobs.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aiobs.labels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: TZ, value: UTC}
            - {name: PGTZ, value: UTC}
            {{- include "aiobs.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD") | nindent 12 }}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-postgres
  labels: {{- include "aiobs.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  selector: {{- include "aiobs.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - {name: pg, port: 5432, targetPort: pg}
---
# ============================ ClickHouse ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-clickhouse
  labels: {{- include "aiobs.labels" (dict "root" . "component" "clickhouse") | nindent 4 }}
spec:
  serviceName: {{ $fn }}-clickhouse
  replicas: 1
  selector:
    matchLabels: {{- include "aiobs.selector" (dict "root" . "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aiobs.labels" (dict "root" . "component" "clickhouse") | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          env:
            - {name: CLICKHOUSE_DB, value: default}
            - {name: CLICKHOUSE_USER, value: clickhouse}
            {{- include "aiobs.secretEnv" (dict "root" . "name" "CLICKHOUSE_PASSWORD") | nindent 12 }}
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
            - {name: logs, mountPath: /var/log/clickhouse-server}
      volumes:
        - {name: logs, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.clickhouse.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.clickhouse.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-clickhouse
  labels: {{- include "aiobs.labels" (dict "root" . "component" "clickhouse") | nindent 4 }}
spec:
  selector: {{- include "aiobs.selector" (dict "root" . "component" "clickhouse") | nindent 4 }}
  ports:
    - {name: http, port: 8123, targetPort: http}
    - {name: native, port: 9000, targetPort: native}
---
# ============================ Redis ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-redis
  labels: {{- include "aiobs.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  serviceName: {{ $fn }}-redis
  replicas: 1
  selector:
    matchLabels: {{- include "aiobs.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aiobs.labels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: [redis-server]
          args: ["--requirepass", "$(REDIS_AUTH)", "--maxmemory-policy", "noeviction"]
          ports:
            - {name: redis, containerPort: 6379}
          env:
            {{- include "aiobs.secretEnv" (dict "root" . "name" "REDIS_AUTH") | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: redis}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.redis.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-redis
  labels: {{- include "aiobs.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  selector: {{- include "aiobs.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
# ============================ MinIO (S3 storage for raw events and media) ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-minio
  labels: {{- include "aiobs.labels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  serviceName: {{ $fn }}-minio
  replicas: 1
  selector:
    matchLabels: {{- include "aiobs.selector" (dict "root" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aiobs.labels" (dict "root" . "component" "minio") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          command: [sh, -c]
          args: ['mkdir -p /data/langfuse && exec minio server --address ":9000" --console-address ":9001" /data']
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          env:
            - {name: MINIO_ROOT_USER, value: minio}
            {{- include "aiobs.secretEnv" (dict "root" . "name" "MINIO_ROOT_PASSWORD") | nindent 12 }}
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: s3}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.minio.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.minio.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-minio
  labels: {{- include "aiobs.labels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  selector: {{- include "aiobs.selector" (dict "root" . "component" "minio") | nindent 4 }}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
    - {name: console, port: 9001, targetPort: console}
